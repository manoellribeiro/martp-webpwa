<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<title>Martp: create interactive map arts using geolocation</title>
		<meta
			name="description"
			content="Martp is an interactive art generator that uses geolocation as a user interaction interface. It is an open-source and educational project developed at the Federal University of Bahia by student Manoel Ribeiro."
		/>
		<meta name="theme-color" content="#120d31" />

		<!-- PWA: manifest and the icons generated by `pnpm pwa:assets` -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" sizes="any" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon-180x180.png" />
		<meta name="apple-mobile-web-app-title" content="Martp" />

		<!-- Link previews. Crawlers read these without running JavaScript, so they are the
		     same on every page; PUBLIC_SITE_URL comes from .env.production. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Martp" />
		<meta property="og:title" content="Create interactive map arts with your geolocation" />
		<meta
			property="og:description"
			content="Contribute to a global digital exhibition by opening the Martp application and generating amazing map arts based on your location."
		/>
		<meta property="og:url" content="%sveltekit.env.PUBLIC_SITE_URL%/" />
		<meta property="og:image" content="%sveltekit.env.PUBLIC_SITE_URL%/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="A map art generated with Martp in Lyon, France" />
		<meta name="twitter:card" content="summary_large_image" />

		<!-- Structured data for search engines: what the app is, who made it and where to
		     follow it (Martp has no X account, so the Instagram profile goes in sameAs). -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebApplication",
				"name": "Martp",
				"url": "%sveltekit.env.PUBLIC_SITE_URL%/",
				"description": "Martp is an interactive art generator that uses geolocation as a user interaction interface. It is an open-source and educational project developed at the Federal University of Bahia by student Manoel Ribeiro.",
				"applicationCategory": "DesignApplication",
				"operatingSystem": "Any",
				"browserRequirements": "Requires JavaScript and access to the device location.",
				"inLanguage": ["en", "de", "es", "fr", "pt-BR"],
				"isAccessibleForFree": true,
				"offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
				"keywords": "map, art, localisation, geolocation, interface, application, generative, interactive, creative",
				"image": "%sveltekit.env.PUBLIC_SITE_URL%/og-image.png",
				"author": { "@type": "Person", "name": "Manoel Ribeiro" },
				"sourceOrganization": { "@type": "CollegeOrUniversity", "name": "Federal University of Bahia" },
				"sameAs": ["https://www.instagram.com/martp.app/"]
			}
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
